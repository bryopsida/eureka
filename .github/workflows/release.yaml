name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        type: string
        required: true
        description: Release tag and name
jobs:
  release-node:
    name: 'Release'
    uses: curium-rocks/flows/.github/workflows/node-ts-release.yml@main
    permissions:
      contents: write
      actions: read
      security-events: write
    with:
      node_version: '20.x'
      working-dir: 'node/'
      continue-on-prod-vulns: true
      publish-docs: false
      tag: ${{ inputs.tag }}
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
  publish-docs:
    permissions:
      pages: write
      id-token: write
    needs:
      - release-node
    uses: curium-rocks/flows/.github/workflows/npm-publish-docs.yml@main
    with:
      publish: true
      node_version: '22.x'
      build_task: 'build:docs'
      path: 'docs'
      working_dir: 'node'
